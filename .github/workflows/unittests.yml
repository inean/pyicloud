name: "Unittests"

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install Dependencies
        run: |
          uv sync --extra test
      - name: Run Unit Tests
        run: |
          uv run pytest -q
