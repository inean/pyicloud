name: "Unittests"

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install Dependencies
        run: |
          uv sync --extra test
      - name: Run Non-Optional Architecture and Challenge Gates
        run: |
          uv run pytest --no-cov -q \
            tests/unit/test_hexagonal_import_boundaries.py \
            tests/integration/test_challenge_contract_gate.py \
            tests/unit/test_legacy_alias_export_ratchet.py \
            tests/unit/test_api_auth_service.py::test_login_challenge_does_not_persist_plaintext_password \
            tests/unit/test_core_services_async_contract.py::test_service_adapters_match_async_port_methods
      - name: Run Unit Tests
        run: |
          uv run pytest -q
