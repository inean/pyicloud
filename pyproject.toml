
[project]
authors = [
    { name = "Carlos Martín", email = "inean.es@gmail.com" },
    { name = "Peter Evans", email = "evans.peter@gmail.com" },
]
description = " PyiCloud is a module that allows Python developers to interact with iCloud web services asynchronously."
name = "aio-pyicloud"
version = "0.1.dev319+ga990ba6.d20240605"

# Project metadata
keywords = ["async", "find-my-iphone", "icloud"]
license  = { text = "MIT" }
readme   = "README.md"

# Python versions supported by this package.
requires-python = ">=3.13"

# Project dependencies.
dependencies = [
    "async-btree @ git+https://github.com/inean/async-btree.git",
    "asyncclick>=8.1.7",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "PyJWT>=2.9.0",
    "python-multipart>=0.0.12",
    "psygnal>=0.11.0",
    "pydantic-settings>=2.2.1",
    "pydantic>=2.6.4",
    "rich>=13.7.1",
    "tzlocal>=5.2",
    "uvicorn>=0.32.0",
]


[project.urls]
Changelog = "https://github.com/inean/releases"
Homepage  = "https://github.com/inean/pyicloud"

[project.scripts]
icloud = "pyicloud.cli.main:main"
icloud-api = "pyicloud.api.main:main"

[project.optional-dependencies]
all = [
    "hypothesis>=6.103.0",
    "mypy>=1.10.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-lazy-fixtures>=1.1.1",
    "pytest>=8.0.0",
    "ruff>=0.4.2",
]
dev = [
    "hypothesis>=6.103.0",
    "mypy>=1.10.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-lazy-fixtures>=1.1.1",
    "pytest>=8.0.0",
    "ruff>=0.4.2",
]
lint = [
    "mypy>=1.10.0",
    "ruff>=0.4.2",
]
rich = ["rich>=13.7.1"]
test = [
    "hypothesis>=6.103.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-lazy-fixtures>=1.1.1",
    "pytest>=8.0.0",
]

[build-system]
# Build backend
build-backend = "hatchling.build"
requires      = ["hatchling"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pyicloud"]

[tool.pytest.ini_options]
addopts      = "-ra -q --cov=pyicloud/api --cov=pyicloud/cli --cov=pyicloud/application --cov=pyicloud/adapters --cov=pyicloud/bootstrap --cov=pyicloud/ports --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
markers = [
    "unit: unit-level tests for modules and adapters",
    "integration: integration tests spanning multiple layers in-process",
    "smoke: lightweight health and CLI smoke checks",
    "vertical: vertical end-to-end tests through API and CLI",
]
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/smoke",
    "tests/vertical",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
extend-select = ["I", "UP"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.mypy]
ignore_missing_imports = true
strict                 = true

[[tool.mypy.overrides]]
check_untyped_defs    = true
disallow_untyped_defs = false
module                = "tests.*"
